<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runpex</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet"><style>
:root{--bg:#FAFAF7;--card:#FFFFFF;--text:#171717;--sub:#6B6B63;--border:#E6E6E0;--accent:#D83A2E;--route:#4B6B3C}
@media (prefers-color-scheme:dark){:root{--bg:#121310;--card:#1B1C18;--text:#F2F2EE;--sub:#A3A39A;--border:#2E2F29;--accent:#FF5A4C;--route:#8DB57A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.8;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;align-items:flex-start;gap:3px;margin-bottom:28px}
.logo{font-family:Poppins,sans-serif;font-weight:600;font-size:26px;letter-spacing:-1px;color:var(--text);text-decoration:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:9px}
h1{font-size:26px;line-height:1.4;margin:0 0 8px}
h2{font-size:19px;margin:36px 0 8px;padding-top:12px;border-top:1px solid var(--border)}
h3{font-size:16px;margin:20px 0 4px}
p,li{font-size:15px}
.table{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--border)}
th{color:var(--sub);font-weight:600}
tr:last-child td{border-bottom:none}
a{color:var(--route)}
footer{margin-top:48px;color:var(--sub);font-size:13px}
</style></head>
<body><main><header><a class="logo" href="./">runpex</a><span class="dot"></span></header>
<h1>Runpex</h1>
<p>走る前にコースを作って、走っている間は声で道案内。スマホを見なくても迷わず走れる、ランニングアプリです。</p>
<ul><li>地図をタップしてコースを作る、または Start ですぐ走る</li><li>曲がり角を声で案内。1kmごとにラップと、前回・目標ペースとの差を読み上げ</li><li>友達と週の距離を競う、ゴーストと勝負する</li></ul>
<p>現在はテスト版です。</p>
<p><a href="privacy/">プライバシーポリシー</a> ・ お問い合わせ：<a href="mailto:runpex.app@gmail.com">runpex.app@gmail.com</a></p>
<footer>© 2026 Runpex</footer></main></body></html>
